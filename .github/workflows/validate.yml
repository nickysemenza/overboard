name: Validate release revision

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Verify revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Install validation tools
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint
      - name: Formatting and lint
        run: |
          swiftformat --lint .
          swiftlint --strict
      - name: Frozen tests and snapshots
        run: swift test --package-path OverboardKit --disable-automatic-resolution -Xswiftc -warnings-as-errors
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-artifacts
      - name: File index performance gate
        run: swift run --package-path OverboardKit --disable-automatic-resolution -c release file-index-benchmark
      - name: Build exact revision
        run: |
          xcodebuild -project Overboard.xcodeproj -scheme Overboard \
            -configuration Release -derivedDataPath build \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot-differences
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore
