name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Versions are pinned in scripts/tools.sh, which local dev uses too, so
      # a linter can't silently upgrade and fail --strict on a new rule.
      - name: Install pinned tools
        run: |
          scripts/tools.sh install
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Verify pinned versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

  test:
    name: OverboardKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Run tests
        run: swift test --package-path OverboardKit

  build:
    name: Build app artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      # Unsigned by choice, not by limitation: fork PRs can't read repo
      # secrets, so this build has no Developer ID identity to sign with
      # even after the release pipeline gained one. This artifact is a smoke
      # check that the app builds, not something meant for distribution —
      # tagged pushes are signed and notarized separately by release.yml.
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project Overboard.xcodeproj \
            -scheme Overboard \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Build/Products/Release/Overboard.app Overboard.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Overboard
          path: Overboard.zip
          if-no-files-found: error
