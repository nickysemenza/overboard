name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are wasted CI minutes — cancel them
# when a newer push arrives instead of letting them race to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # SwiftFormat ships on the macos-26 image; SwiftLint is a bottled brew
      # install. Locally both come from Homebrew. A point-release drift
      # between the two just means fixing whatever new rule fires — nothing
      # is disabled or pinned.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

  test:
    name: OverboardKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # The macos-26 image's default Xcode is its newest one.
      - run: xcodebuild -version

      # The cache key includes the selected toolchain: .swiftmodules from one
      # Swift version don't load in the next, and the macos-26 image swaps
      # Xcode point releases underneath us without any change in this repo.
      - name: Toolchain fingerprint
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Caches SwiftPM's resolved-dependency checkouts (.build) and its
      # global package cache, keyed on Package.resolved so a dependency bump
      # invalidates it automatically. Cuts most of the "resolve + fetch +
      # compile dependencies" time on a cache hit.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            OverboardKit/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ steps.toolchain.outputs.id }}-${{ hashFiles('OverboardKit/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.toolchain.outputs.id }}-

      # -warnings-as-errors reaches first-party targets only: SwiftPM builds
      # dependency targets with -suppress-warnings, so a deprecation in GRDB
      # or swift-syntax can't fail this job. (A per-target
      # `.treatAllWarnings` in Package.swift would, but it conflicts with the
      # -suppress-warnings Xcode adds to package targets and breaks the app
      # build — see the comment in Package.swift.)
      # SnapshotTesting writes the image it *took* for every failed pixel
      # assertion under SNAPSHOT_ARTIFACTS; uploading that directory turns a
      # "percentage of pixels that match 0.13" line into something you can
      # actually diff against the checked-in reference.
      - name: Run tests
        run: swift test --package-path OverboardKit -Xswiftc -warnings-as-errors
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-artifacts

      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failed-snapshots
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore

      # Informational only, never a gate: prints the file-name index's warm
      # query timings (p95 in particular) into the job summary so a
      # regression is visible at a glance without digging through raw logs.
      # `continue-on-error` covers both a hard failure (the benchmark itself
      # throws past its own 100ms p95 budget) and a merely slow runner — a
      # noisy CI machine shouldn't block a PR the way an actual test would.
      - name: File index benchmark (informational)
        continue-on-error: true
        run: |
          {
            echo '### File index benchmark'
            echo '```'
            swift run --package-path OverboardKit -c release file-index-benchmark
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build app artifact
    runs-on: macos-26
    steps:
      # Full history + tags: shared with release.yml — the signed path below
      # goes through the same "Embed git version" build phase, which needs
      # `git describe` to resolve, and the default shallow checkout has
      # neither the tag objects nor the history for that.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same SwiftPM caches as the test job (same toolchain-keyed reasoning),
      # plus xcodebuild's own copy of resolved packages under
      # DerivedData/SourcePackages — xcodebuild doesn't share
      # OverboardKit/.build, it re-resolves into DerivedData.
      - name: Toolchain fingerprint
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            OverboardKit/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ steps.toolchain.outputs.id }}-${{ hashFiles('OverboardKit/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.toolchain.outputs.id }}-

      # Secrets are unavailable to workflow runs triggered from a fork PR,
      # and a job-level `if:` can't reference `secrets` directly — so probe
      # for one via an `env:` var and test it in the shell instead.
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}

      # Signed + notarized path: every push/PR/workflow_dispatch run gets a
      # real Developer-ID-signed, notarized artifact when the secrets are
      # available (same-repo pushes and PRs from branches, not forks).
      # Notarization is free and only takes a few minutes. No MARKETING_VERSION
      # override — embed-git-version.sh's git-describe fallback stamps it.
      - name: Build, sign, and notarize
        if: steps.secrets.outputs.available == 'true'
        uses: ./.github/actions/build-signed
        with:
          p12-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          api-key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          output-zip: Overboard.zip

      # Fork-PR fallback: no repo secrets means no Developer ID identity to
      # sign with, so this is unsigned by necessity here (not by choice —
      # same-repo runs take the signed path above). Still a useful smoke
      # check that the app builds; not meant for distribution.
      - name: Build (Release, unsigned fallback)
        if: steps.secrets.outputs.available != 'true'
        run: |
          xcodebuild -project Overboard.xcodeproj \
            -scheme Overboard \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip app bundle (unsigned fallback)
        if: steps.secrets.outputs.available != 'true'
        run: ditto -c -k --keepParent build/Build/Products/Release/Overboard.app Overboard.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Overboard
          path: Overboard.zip
          if-no-files-found: error
