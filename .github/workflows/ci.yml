name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    # Pin both linters: an unpinned `brew install` / preinstalled runner binary
    # can silently upgrade and fail --strict on a new/changed rule with no code
    # change. Bump these deliberately (keep in sync with local dev versions).
    env:
      SWIFTLINT_VERSION: 0.65.0
      SWIFTFORMAT_VERSION: 0.61.1
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftFormat (pinned)
        run: |
          curl -fLo swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o swiftformat.zip -d swiftformat-bin
          chmod +x swiftformat-bin/swiftformat
          echo "$PWD/swiftformat-bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint (pinned)
        run: |
          curl -fLo swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o swiftlint.zip -d swiftlint-bin
          chmod +x swiftlint-bin/swiftlint
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Verify pinned versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

  test:
    name: OverboardKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Run tests
        run: swift test --package-path OverboardKit

  build:
    name: Build app artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      # Unsigned: no signing identity on CI. Downloaded artifacts carry the
      # quarantine attribute, so Gatekeeper requires right-click → Open (or
      # build locally with the real identity for daily use).
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project Overboard.xcodeproj \
            -scheme Overboard \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Build/Products/Release/Overboard.app Overboard.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Overboard
          path: Overboard.zip
          if-no-files-found: error
