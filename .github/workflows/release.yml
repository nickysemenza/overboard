name: Release

# Tag pushes (v1.0.0) build a Developer-ID-signed, notarized zip — via the
# shared ./.github/actions/build-signed composite action, also used by
# ci.yml so every push/PR/workflow_dispatch run notarizes too when the
# signing secrets are available (notarization is free and just takes a few
# minutes) — and attach it to a GitHub Release. Requires five repo secrets
# (see README.md § Release signing for how to generate each):
#   DEVELOPER_ID_P12_BASE64      base64 of the exported .p12 (cert + key)
#   DEVELOPER_ID_P12_PASSWORD    that .p12's export password
#   APP_STORE_CONNECT_API_KEY_P8 contents of the notary API key's .p8
#   APP_STORE_CONNECT_KEY_ID     that key's ID
#   APP_STORE_CONNECT_ISSUER_ID  the API key's issuer ID
on:
  push:
    tags: ["v*"]

# One release group per workflow (tags are unique, but this keeps a
# re-pushed tag from racing itself). cancel-in-progress is deliberately
# false: notarization runs inside this job, and killing it mid-flight would
# leave the tag's release build half-notarized with no automatic retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      # Full history + tags: the "Embed git version" build phase runs
      # `git describe` to stamp GitDescribe/GitSHA, and the default shallow
      # checkout has neither the tag objects nor the history to resolve it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize
        uses: ./.github/actions/build-signed
        with:
          version: ${{ steps.version.outputs.version }}
          p12-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          api-key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          output-zip: Overboard-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Overboard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "Overboard-${GITHUB_REF_NAME#v}.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      # Keep the in-repo Homebrew cask (Casks/overboard.rb) pointing at this
      # release so `brew tap nickysemenza/overboard https://github.com/nickysemenza/overboard`
      # users get it from `brew upgrade` without a manual bump. This is the one
      # place CI pushes to main outside the PR flow, on purpose: the cask is
      # derived data (tag + checksum of the asset just uploaded), and a human
      # bumping it by hand is exactly the step that gets forgotten. Branch
      # protection on main, if enabled, must let github-actions[bot] push.
      # `permissions: contents: write` above covers the push.
      - name: Update the Homebrew cask on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum="$(shasum -a 256 "Overboard-${version}.zip" | cut -d' ' -f1)"
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' \
            -e "s/^  version \".*\"$/  version \"${version}\"/" \
            -e "s/^  sha256 .*$/  sha256 \"${checksum}\"/" \
            Casks/overboard.rb
          if git diff --quiet -- Casks/overboard.rb; then
            echo "Cask already at ${version}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/overboard.rb
          git commit -m "Cask: Overboard ${version}"
          git push origin HEAD:main
          {
            echo "## Homebrew cask"
            echo
            echo "Bumped \`Casks/overboard.rb\` on main to ${version} (sha256 ${checksum})."
          } >> "$GITHUB_STEP_SUMMARY"
