name: Release

# Tag pushes (v1.0.0) build a Developer-ID-signed, notarized zip — via the
# shared ./.github/actions/build-signed composite action, also used by
# ci.yml so every push/PR/workflow_dispatch run notarizes too when the
# signing secrets are available (notarization is free and just takes a few
# minutes) — attach it to a GitHub Release, and bump the cask in
# nickysemenza/homebrew-tap. Requires six repo secrets (see README.md §
# Release signing for how to generate each):
#   DEVELOPER_ID_P12_BASE64      base64 of the exported .p12 (cert + key)
#   DEVELOPER_ID_P12_PASSWORD    that .p12's export password
#   APP_STORE_CONNECT_API_KEY_P8 contents of the notary API key's .p8
#   APP_STORE_CONNECT_KEY_ID     that key's ID
#   APP_STORE_CONNECT_ISSUER_ID  the API key's issuer ID
#   HOMEBREW_TAP_TOKEN           fine-grained PAT, Actions read/write on
#                                nickysemenza/homebrew-tap only
on:
  push:
    tags: ["v*"]

# One release group per workflow (tags are unique, but this keeps a
# re-pushed tag from racing itself). cancel-in-progress is deliberately
# false: notarization runs inside this job, and killing it mid-flight would
# leave the tag's release build half-notarized with no automatic retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      # Full history + tags: the "Embed git version" build phase runs
      # `git describe` to stamp GitDescribe/GitSHA, and the default shallow
      # checkout has neither the tag objects nor the history to resolve it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize
        uses: ./.github/actions/build-signed
        with:
          version: ${{ steps.version.outputs.version }}
          p12-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          api-key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          output-zip: Overboard-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Overboard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "Overboard-${GITHUB_REF_NAME#v}.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      # The cask lives in nickysemenza/homebrew-tap so `brew install --cask
      # nickysemenza/tap/overboard` works cold and main here never receives a
      # post-release commit. The tap's bump.yml does the real work with
      # Homebrew's own `brew bump-cask-pr` (downloads the zip just published,
      # rewrites version/sha256, audits, commits, pushes); this step only
      # kicks it off, so it needs a token with Actions: write on the tap and
      # nothing else. Fire-and-forget: a failed bump shows up in the tap's
      # Actions tab and can be re-run there by hand.
      - name: Bump the cask in nickysemenza/homebrew-tap
        run: |
          gh workflow run bump.yml \
            --repo nickysemenza/homebrew-tap \
            --field cask=overboard \
            --field "version=${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
