name: Release

# Tag pushes (v1.0.0) build the same unsigned zip as CI and attach it to a
# GitHub Release. Unsigned because there's no paid Developer Program
# membership — downloaders clear Gatekeeper with right-click → Open.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project Overboard.xcodeproj \
            -scheme Overboard \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            build

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/Overboard.app \
            "Overboard-${GITHUB_REF_NAME#v}.zip"

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Overboard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "Overboard-${GITHUB_REF_NAME#v}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
