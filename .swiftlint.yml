# SwiftFormat owns formatting. The only settings here make SwiftLint accept
# SwiftFormat's output instead of fighting it; no rule is disabled and the
# source tree carries no `swiftlint:disable` comments.
included:
  - Overboard
  - OverboardKit/Sources
  - OverboardKit/Tests
  - OverboardQuickLook
excluded:
  - OverboardKit/.build
  - build
trailing_comma:
  mandatory_comma: true # .swiftformat --trailingcommas collections-only
opening_brace:
  ignore_multiline_statement_conditions: true # SwiftFormat puts `{` on its own line after a wrapped condition
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true
identifier_name:
  min_length: 2 # GRDB's `{ db in … }` convention
